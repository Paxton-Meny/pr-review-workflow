<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 380" width="380" role="img" aria-labelledby="hdt">
<title id="hdt">The review dial: a run's state ticking from five findings open, through a reopened contract in round two, to zero open and a proven merge, while a point orbits review, edit, verify, and ship</title>
<style>
text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.hair{stroke:#E4E2D8}
.tick{stroke:#B4B2A9}
.lbl{font-size:10px;font-weight:700;letter-spacing:2.2px;fill:#8b8a83}
.num{font-family:'Iowan Old Style',Palatino,Georgia,serif;font-size:88px;font-weight:700}
.cap{font-size:12px;font-weight:700;letter-spacing:2.4px}
.det{font-size:11.5px;fill:#8b8a83}
.cor{fill:#993C1D}.pur{fill:#534AB7}.tea{fill:#0F6E56}
.chk{stroke:#0F6E56}
.pipe{fill:none;stroke:#C9C7BE;stroke-width:1.8}
.orbit{animation:orbit 11s linear infinite;transform-origin:190px 190px}
@keyframes orbit{to{transform:rotate(360deg)}}
.s{opacity:0}
.s1{animation:s1 11s linear infinite}
.s2{animation:s2 11s linear infinite}
.s3{animation:s3 11s linear infinite}
.s4{animation:s4 11s linear infinite}
.s5{animation:s5 11s linear infinite}
@keyframes s1{0%,16%{opacity:1}19%,100%{opacity:0}}
@keyframes s2{0%,19%{opacity:0}22%,36%{opacity:1}39%,100%{opacity:0}}
@keyframes s3{0%,39%{opacity:0}42%,58%{opacity:1}61%,100%{opacity:0}}
@keyframes s4{0%,61%{opacity:0}64%,76%{opacity:1}79%,100%{opacity:0}}
@keyframes s5{0%,79%{opacity:0}82%,98%{opacity:1}100%{opacity:0}}
.p1{animation:p1 11s linear infinite}
.p2{animation:p2 11s linear infinite}
@keyframes p1{0%,20%{fill:transparent}23%,100%{fill:#D97757}}
@keyframes p2{0%,42%{fill:transparent}45%,100%{fill:#D97757}}
@media (prefers-color-scheme:dark){
.hair{stroke:#3F3E3A}
.tick{stroke:#5F5E5A}
.cor{fill:#F0997B}.pur{fill:#AFA9EC}.tea{fill:#5DCAA5}
.chk{stroke:#5DCAA5}
.pipe{stroke:#5F5E5A}}
</style>
<circle cx="190" cy="190" r="158" class="hair" fill="none" stroke-width="1.5"/>
<circle cx="190" cy="190" r="146" class="hair" fill="none" stroke-width="1" opacity="0.6"/>
<path d="M190 32 A158 158 0 0 1 348 190" stroke="#534AB7" stroke-width="3.5" fill="none" stroke-linecap="round"/>
<path d="M348 190 A158 158 0 0 1 190 348" stroke="#0F6E56" stroke-width="3.5" fill="none" stroke-linecap="round"/>
<path d="M32 190 A158 158 0 0 1 190 32" stroke="#993C1D" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.85"/>
<g class="tick" stroke-width="1.5">
<path d="M190 22 V40"/><path d="M340 190 H358"/><path d="M190 340 V358"/><path d="M22 190 H40"/>
</g>
<text x="190" y="14" text-anchor="middle" class="lbl">REVIEW</text>
<text x="372" y="193" text-anchor="start" class="lbl" transform="rotate(90 372 193)">EDIT</text>
<text x="190" y="374" text-anchor="middle" class="lbl">VERIFY</text>
<text x="8" y="193" text-anchor="end" class="lbl" transform="rotate(-90 8 193)">SHIP</text>
<g class="orbit"><circle cx="190" cy="32" r="7" fill="#D97757"/><circle cx="190" cy="32" r="10" fill="none" class="hair" stroke-width="1.2"/></g>
<g class="s s1">
<text x="190" y="172" text-anchor="middle" class="num cor">5</text>
<text x="190" y="202" text-anchor="middle" class="cap cor">FINDINGS OPEN</text>
<text x="190" y="222" text-anchor="middle" class="det">each with a testable contract</text>
</g>
<g class="s s2">
<text x="190" y="172" text-anchor="middle" class="num pur">5</text>
<text x="190" y="202" text-anchor="middle" class="cap pur">ADDRESSED</text>
<text x="190" y="222" text-anchor="middle" class="det">one commit per finding</text>
</g>
<g class="s s3">
<text x="190" y="172" text-anchor="middle" class="num cor">1</text>
<text x="190" y="202" text-anchor="middle" class="cap cor">REOPENED</text>
<text x="190" y="222" text-anchor="middle" class="det">a contract failed, round 2 of 4</text>
</g>
<g class="s s4">
<text x="190" y="172" text-anchor="middle" class="num tea">0</text>
<text x="190" y="202" text-anchor="middle" class="cap tea">OPEN</text>
<text x="190" y="222" text-anchor="middle" class="det">every contract holds</text>
</g>
<g class="s s5">
<path d="M160 142 L182 166 L224 118" class="chk" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="190" y="202" text-anchor="middle" class="cap tea">MERGED</text>
<text x="190" y="222" text-anchor="middle" class="det">proven, never assumed</text>
</g>
<g>
<circle cx="157" cy="252" r="6" class="p1 pipe"/>
<circle cx="179" cy="252" r="6" class="p2 pipe"/>
<circle cx="201" cy="252" r="6" class="pipe"/>
<circle cx="223" cy="252" r="6" class="pipe"/>
</g>
</svg>
