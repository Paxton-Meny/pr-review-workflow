<g class="lf lf0"><rect x="191.42" y="704" width="8" height="8" rx="2"/><text class="mono" x="204.42" y="712" style="font-size:10px">seams.txt</text></g>
<g class="lf lf1"><rect x="274.6" y="704" width="8" height="8" rx="2"/><text class="mono" x="287.6" y="712" style="font-size:10px">routes.txt</text></g>
<g class="lf lf3"><rect x="363.8" y="704" width="8" height="8" rx="2"/><text class="mono" x="376.8" y="712" style="font-size:10px">findings/F001 … F005</text></g>
