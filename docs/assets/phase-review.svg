<defs><filter id="pr-sh" x="-10%" y="-25%" width="120%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1b1b19" flood-opacity="0.09"/></filter><marker id="pr-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arh" d="M1 1.5L9 5L1 8.5z"/></marker></defs>
<text class="ttl" x="24" y="30" style="font-size:16px">Review</text>
<text x="24" y="49">Once, thoroughly. Judgment is spent where the change is deep; the scripts decide where that is.</text>
<g filter="url(#pr-sh)"><rect class="term" x="24" y="62" width="812" height="112" rx="9"/></g>
<text class="mono tl tl0" x="36" y="82"><tspan class="tm">shard-plan:</tspan> groups 1 seams 0 couplings 3 limit 1500</text>
<text class="mono tl tl1" x="36" y="100"><tspan class="tm">route</tspan> review all rung base model inherit effort high reason role-model samples 1</text>
<text class="mono tl tl3" x="36" y="118"><tspan class="tm">save-findings:</tspan> 5 findings saved, next id F006</text>
<text class="mono tl tl4" x="36" y="136"><tspan class="tm">dedup-findings:</tspan> kept 5 merged 0</text>
<text class="mono tl tl5" x="36" y="154"><tspan class="tm">route</tspan> gap all rung base model inherit effort high reason follows-reviewer</text>
<text class="tm" x="826" y="168" text-anchor="end" style="font-size:9.5px">what the orchestrating session sees</text>
<g class="cardg st0" data-step="0"><rect class="c" x="24" y="214" width="232" height="70" rx="9"/>
<text class="h" x="36" y="234" style="font-size:12.5px">shard-plan</text>
<text x="36" y="250" style="font-size:10.5px">couplings cluster files into groups</text>
<text x="36" y="265" style="font-size:10.5px">seams: what no shard sees alone</text>
</g>
<g class="chip note ex0"><rect x="24" y="292" width="180.458" height="19" rx="9.5"/>
<text x="114.229" y="305.5" text-anchor="middle" style="font-size:10.5px">over the posture’s limit → shards</text>
</g>
<g class="cardg st1" data-step="1"><rect class="c" x="24" y="330" width="232" height="70" rx="9"/>
<text class="h" x="36" y="350" style="font-size:12.5px">route-models review</text>
<text x="36" y="366" style="font-size:10.5px">a rung and an effort per group</text>
<text x="36" y="381" style="font-size:10.5px">from size, couplings, probes, posture</text>
</g>
<g class="cardg st3" data-step="3"><rect class="c" x="24" y="440" width="232" height="70" rx="9"/>
<text class="h" x="36" y="460" style="font-size:12.5px">save-findings</text>
<text x="36" y="476" style="font-size:10.5px">ids assigned, records validated</text>
<text x="36" y="491" style="font-size:10.5px">a batch posts whole or not at all</text>
</g>
<g class="cardg st4" data-step="4"><rect class="c" x="24" y="540" width="232" height="70" rx="9"/>
<text class="h" x="36" y="560" style="font-size:12.5px">dedup-findings</text>
<text x="36" y="576" style="font-size:10.5px">samples above one: duplicates merge</text>
<text x="36" y="591" style="font-size:10.5px">the richest record wins, support counted</text>
</g>
<path class="ar" d="M140 284 L140 328" marker-end="url(#pr-a)"/>
<path class="ar" d="M140 510 L140 538" marker-end="url(#pr-a)"/>
<g class="cardg st2" data-step="2"><rect class="cm" x="292" y="300" width="206" height="54" rx="9"/>
<text class="h hm" x="304" y="320" style="font-size:12.5px">Reviewer · group 1</text>
<text class="sm" x="304" y="336" style="font-size:10.5px">its files, the rules, the probes</text>
</g>
<g class="cardg st2" data-step="2"><rect class="cm" x="292" y="372" width="206" height="54" rx="9"/>
<text class="h hm" x="304" y="392" style="font-size:12.5px">Reviewer · group 2</text>
<text class="sm" x="304" y="408" style="font-size:10.5px">in parallel, its own context</text>
</g>
<g class="cardg st2" data-step="2"><rect class="cm" x="292" y="444" width="206" height="54" rx="9" stroke-dasharray="5 4"/>
<text class="h hm" x="304" y="464" style="font-size:12.5px">Reviewer · group n</text>
<text class="sm" x="304" y="480" style="font-size:10.5px">× review samples, when set</text>
</g>
<path class="ar" d="M256 365 L290 327" marker-end="url(#pr-a)"/>
<path class="ar" d="M256 365 L290 399" marker-end="url(#pr-a)"/>
<path class="ar" d="M256 365 L290 471" stroke-dasharray="3 4" marker-end="url(#pr-a)"/>
<path class="ar" d="M292 460 L180 460 L180 438" marker-end="url(#pr-a)"/>
<g class="cardg st5" data-step="5"><rect class="cm" x="292" y="540" width="206" height="70" rx="9"/>
<text class="h hm" x="304" y="560" style="font-size:12.5px">Gap pass</text>
<text class="sm" x="304" y="576" style="font-size:10.5px">seams first, then what was missed</text>
<text class="sm" x="304" y="591" style="font-size:10.5px">never below the reviewer’s rung</text>
</g>
<path class="ar" d="M256 575 L290 575" marker-end="url(#pr-a)"/>
<g class="chip good ex6"><rect x="292" y="622" width="249.812" height="19" rx="9.5"/>
<text x="416.906" y="635.5" text-anchor="middle" style="font-size:10.5px">no findings → clean: straight to the merge gate</text>
</g>
<g class="chip note ex6"><rect x="292" y="646" width="95.5552" height="19" rx="9.5"/>
<text x="339.778" y="659.5" text-anchor="middle" style="font-size:10.5px">findings → Post</text>
</g>
<path class="ar" d="M395 610 L395 620" marker-end="url(#pr-a)"/>
<g class="cardg"><rect class="c" x="528" y="214" width="308" height="126" rx="9"/>
<text class="h" x="540" y="234" style="font-size:12.5px">The routing ladder</text>
<text x="540" y="250" style="font-size:10.5px">strong ← large code, coupled files, a stakes probe</text>
<text x="540" y="265" style="font-size:10.5px">base ← the role’s own model, the default rung</text>
<text x="540" y="280" style="font-size:10.5px">cheap ← a small docs or config change, no risk</text>
<text x="540" y="295" style="font-size:10.5px">effort: low … xhigh; a retry moves one lever</text>
<text x="540" y="310" style="font-size:10.5px">the posture leans every line, pins nothing</text>
</g>
<g class="cardg"><rect class="c" x="528" y="360" width="308" height="250" rx="9"/>
<text class="h" x="540" y="380" style="font-size:12.5px">What a finding record carries</text>
<text class="mono" x="540" y="396" style="font-size:10.5px">category: correctness   severity: major</text>
<text class="mono" x="540" y="411" style="font-size:10.5px">path: src/retry.py   line: 42   side: RIGHT</text>
<text class="mono" x="540" y="426" style="font-size:10.5px">title: Retry loop drops the final attempt</text>
<text class="mono" x="540" y="441" style="font-size:10.5px">--- the evidence, in the reviewer’s words</text>
<text class="mono" x="540" y="456" style="font-size:10.5px">Fix: raise err after the loop; tests live in</text>
<text class="mono" x="540" y="471" style="font-size:10.5px">     tests/test_client.py beside test_retry</text>
<text class="mono" x="540" y="486" style="font-size:10.5px">Check: pytest tests/test_client.py::test_exh</text>
<text class="mono" x="540" y="501" style="font-size:10.5px">Resolution: the last exception propagates</text>
<text class="mono" x="540" y="516" style="font-size:10.5px">     and the retry test asserts it</text>
<text class="mono" x="540" y="531" style="font-size:10.5px">```suggestion … ``` posts only once proven</text>
<text class="mono" x="540" y="546" style="font-size:10.5px">Criteria note: when no listed item names it</text>
<text class="mono" x="540" y="561" style="font-size:10.5px">support: 2   placement: inline | summary</text>
<text class="mono" x="540" y="576" style="font-size:10.5px">Route: round 1 rung cheap model sonnet …</text>
</g>
<rect class="lane" x="24" y="676" width="812" height="46" rx="9"/>
<text class="k" x="36" y="693" style="font-size:9.5px">written to the ledger</text>
