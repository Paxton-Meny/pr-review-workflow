<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 740" width="860" role="img" aria-labelledby="prt prd" class="pr">
<title id="prt">Phase 2, Review: one plan, parallel reviewers, one ledger</title>
<desc id="prd">The diff is planned into shards when it is large, clustering files that reference one another and recording the seams no shard can see. Routing picks a rung for each group, cheap, the role's own model, or the strong model, from size, couplings, probes, and the cost posture, and an effort that a retry moves one lever at a time. Reviewers run in parallel, one per group, times the review samples; their records are banked with ids, duplicates merge with a support count, and a gap pass reads the seams first and reports only what was missed. A clean ledger skips straight to the merge gate. The record anatomy shows the contract every finding carries.</desc>
