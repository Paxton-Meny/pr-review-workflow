<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 960" width="860" role="img" aria-labelledby="t d">
<title id="t">The review loop, layer by layer</title>
<desc id="d">One invocation stages everything with shell scripts, a reviewer layer fans out on large diffs with an optional gap pass, findings post to the pull request, a remediation loop of editor, check gate, verifier, and skim runs at most four rounds, and a merge gate ends in merged, ask, or parked.</desc>
<style>
text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:600}.ts{font-size:12px}
.g{fill:#F1EFE8;stroke:#5F5E5A}.p{fill:#EEEDFE;stroke:#534AB7}.tl{fill:#E1F5EE;stroke:#0F6E56}.co{fill:#FAECE7;stroke:#993C1D}
.tg{fill:#2C2C2A}.tg2{fill:#5F5E5A}.tp{fill:#26215C}.tp2{fill:#534AB7}.tt{fill:#04342C}.tt2{fill:#0F6E56}.tc{fill:#4A1B0C}.tc2{fill:#993C1D}
.frame{fill:none;stroke:#888780}.ar{stroke:#888780;fill:none}.arh{fill:#888780}
@media (prefers-color-scheme:dark){
.g{fill:#444441;stroke:#B4B2A9}.p{fill:#3C3489;stroke:#AFA9EC}.tl{fill:#085041;stroke:#5DCAA5}.co{fill:#712B13;stroke:#F0997B}
.tg{fill:#F1EFE8}.tg2{fill:#D3D1C7}.tp{fill:#CECBF6}.tp2{fill:#AFA9EC}.tt{fill:#9FE1CB}.tt2{fill:#5DCAA5}.tc{fill:#F5C4B3}.tc2{fill:#F0997B}
.frame{stroke:#B4B2A9}.ar{stroke:#B4B2A9}.arh{fill:#B4B2A9}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="arh" d="M0 0L10 5L0 10z"/></marker></defs>
<text class="ts tg2" x="430" y="26" text-anchor="middle">gray scripts run deterministically at zero model cost, purple boxes are isolated model contexts, teal is GitHub</text>
<rect class="g" x="270" y="44" width="320" height="56" rx="8"/>
<text class="th tg" x="430" y="66" text-anchor="middle">/pr-review-workflow:review-pr</text>
<text class="ts tg2" x="430" y="86" text-anchor="middle">one invocation, resumable from the ledger</text>
<line class="ar" x1="430" y1="100" x2="430" y2="130" marker-end="url(#a)"/>
<rect class="g" x="210" y="136" width="440" height="76" rx="8"/>
<text class="th tg" x="430" y="158" text-anchor="middle">Deterministic staging</text>
<text class="ts tg2" x="430" y="178" text-anchor="middle">a POSIX script layer probes, fetches, and prepares</text>
<text class="ts tg2" x="430" y="196" text-anchor="middle">annotated diffs, leads, conventions, standards, worktree</text>
<line class="ar" x1="430" y1="212" x2="430" y2="242" marker-end="url(#a)"/>
<rect class="frame" x="70" y="248" width="720" height="176" rx="12" stroke-dasharray="5 4"/>
<text class="th tg" x="90" y="272">Review layer</text>
<text class="ts tg2" x="770" y="272" text-anchor="end">one pass, or up to four shards in parallel</text>
<rect class="p" x="151" y="288" width="170" height="56" rx="8"/>
<text class="th tp" x="236" y="310" text-anchor="middle">Reviewer</text>
<text class="ts tp2" x="236" y="330" text-anchor="middle">reads shard 1</text>
<rect class="p" x="345" y="288" width="170" height="56" rx="8"/>
<text class="th tp" x="430" y="310" text-anchor="middle">Reviewer</text>
<text class="ts tp2" x="430" y="330" text-anchor="middle">reads shard 2</text>
<rect class="p" x="539" y="288" width="170" height="56" rx="8"/>
<text class="th tp" x="624" y="310" text-anchor="middle">Reviewer</text>
<text class="ts tp2" x="624" y="330" text-anchor="middle">reads shard n</text>
<rect class="p" x="250" y="356" width="360" height="48" rx="8" stroke-dasharray="5 4"/>
<text class="th tp" x="430" y="374" text-anchor="middle">Gap pass</text>
<text class="ts tp2" x="430" y="392" text-anchor="middle">always after shards, risk-gated otherwise</text>
<line class="ar" x1="430" y1="424" x2="430" y2="454" marker-end="url(#a)"/>
<rect class="tl" x="240" y="460" width="380" height="56" rx="8"/>
<text class="th tt" x="430" y="482" text-anchor="middle">Round posted to the PR</text>
<text class="ts tt2" x="430" y="502" text-anchor="middle">inline threads; suggestion fences only after proof</text>
<line class="ar" x1="430" y1="516" x2="430" y2="546" marker-end="url(#a)"/>
<rect class="frame" x="40" y="552" width="780" height="190" rx="12" stroke-dasharray="5 4"/>
<text class="th tc" x="60" y="576">Remediation loop</text>
<text class="ts tg2" x="800" y="576" text-anchor="end">at most four rounds; two reopens escalate</text>
<rect class="p" x="55" y="592" width="170" height="56" rx="8"/>
<text class="th tp" x="140" y="614" text-anchor="middle">Editor</text>
<text class="ts tp2" x="140" y="634" text-anchor="middle">a commit per finding</text>
<line class="ar" x1="225" y1="620" x2="241" y2="620" marker-end="url(#a)"/>
<rect class="g" x="245" y="592" width="180" height="56" rx="8"/>
<text class="th tg" x="335" y="614" text-anchor="middle">Check gate</text>
<text class="ts tg2" x="335" y="634" text-anchor="middle">the project checks pass</text>
<line class="ar" x1="425" y1="620" x2="441" y2="620" marker-end="url(#a)"/>
<rect class="p" x="445" y="592" width="170" height="56" rx="8"/>
<text class="th tp" x="530" y="614" text-anchor="middle">Verifier</text>
<text class="ts tp2" x="530" y="634" text-anchor="middle">judges the contract</text>
<line class="ar" x1="615" y1="620" x2="631" y2="620" marker-end="url(#a)"/>
<rect class="g" x="635" y="592" width="170" height="56" rx="8"/>
<text class="th tg" x="720" y="614" text-anchor="middle">Skim</text>
<text class="ts tg2" x="720" y="634" text-anchor="middle">no drive-by changes</text>
<path class="ar" d="M720 648V666H140V652" marker-end="url(#a)"/>
<text class="ts tc2" x="430" y="692" text-anchor="middle">open findings return for the next round; a clean count exits below</text>
<line class="ar" x1="430" y1="742" x2="430" y2="772" marker-end="url(#a)"/>
<rect class="g" x="330" y="778" width="200" height="56" rx="8"/>
<text class="th tg" x="430" y="800" text-anchor="middle">Merge gate</text>
<text class="ts tg2" x="430" y="820" text-anchor="middle">auto-approve setting</text>
<line class="ar" x1="430" y1="834" x2="167" y2="862" marker-end="url(#a)"/>
<line class="ar" x1="430" y1="834" x2="430" y2="862" marker-end="url(#a)"/>
<line class="ar" x1="430" y1="834" x2="693" y2="862" marker-end="url(#a)"/>
<rect class="tl" x="50" y="866" width="230" height="56" rx="8"/>
<text class="th tt" x="165" y="888" text-anchor="middle">Merged</text>
<text class="ts tt2" x="165" y="908" text-anchor="middle">rebase, proven MERGED</text>
<rect class="g" x="315" y="866" width="230" height="56" rx="8"/>
<text class="th tg" x="430" y="888" text-anchor="middle">You choose</text>
<text class="ts tg2" x="430" y="908" text-anchor="middle">merge now or hold</text>
<rect class="g" x="580" y="866" width="230" height="56" rx="8"/>
<text class="th tg" x="695" y="888" text-anchor="middle">Parked</text>
<text class="ts tg2" x="695" y="908" text-anchor="middle">status comment, resumable</text>
</svg>
