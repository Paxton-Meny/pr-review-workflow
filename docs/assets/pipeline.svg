<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 1012" width="860" role="img" aria-labelledby="plt pld" class="fg">
<title id="plt">The shape of a run, in three lanes</title>
<desc id="pld">Scripts run down the center as the backbone: one command stages the pull request from GitHub with no model, plans the read, and delegates to a reviewer, up to four in parallel, then a gap pass; findings are banked, filtered, proven, and posted as inline threads. A loop of at most four rounds opens a round, hands the editor one commit per finding, runs the project's check gate, executes the contracts for the verifier, and skims the round for unasked changes. A merge gate asks first, then merges; a run that does not converge parks with a status comment and resumes later.</desc>
<style>
.fg{--bg:#FDFCFA;--card:#FFFFFF;--panel:#F1EFE8;--lane:#F6F4EE;--ink:#2C2C2A;--muted:#5F5E5A;--faint:#8b8a83;--line:#E4E2D8;--rule:#C9C7BE;--accent:#534AB7;--accent-bg:#EEEDFE;--accent-ink:#26215C;--accent-line:#B9B4EA;--teal:#0F6E56;--teal-bg:#E1F5EE;--teal-ink:#04342C;--teal-line:#8FCDB8;--coral:#993C1D;--coral-bg:#FAECE7;--coral-ink:#4A1B0C;--clay:#D97757;--term:#2C2C2A;--term-line:#2C2C2A;--shadow:.09}
@media (prefers-color-scheme:dark){.fg{--bg:#1E1E1C;--card:#2C2C2A;--panel:#383835;--lane:#232321;--ink:#F1EFE8;--muted:#B4B2A9;--faint:#8b8a83;--line:#44433F;--rule:#5F5E5A;--accent:#AFA9EC;--accent-bg:#2F2A6B;--accent-ink:#E4E2FB;--accent-line:#534AB7;--teal:#5DCAA5;--teal-bg:#0a3f33;--teal-ink:#C9F0E2;--teal-line:#0F6E56;--coral:#F0997B;--coral-bg:#4a2214;--coral-ink:#F5C4B3;--clay:#D97757;--term:#141413;--term-line:#44433F;--shadow:.3}}
.fg text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:11.5px;fill:var(--muted)}
.fg .mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
.fg .serif{font-family:'Iowan Old Style',Palatino,Georgia,serif}
.fg .h{font-size:13.5px;font-weight:700;fill:var(--ink)}
.fg .k{font-size:10.5px;font-weight:700;letter-spacing:1.6px;fill:var(--ink)}
.fg .mid{text-anchor:middle}.fg .end{text-anchor:end}
.fg .c{fill:var(--card);stroke:var(--line)}
.fg .cm{fill:var(--accent-bg);stroke:var(--accent-line)}
.fg .cg{fill:var(--teal-bg);stroke:var(--teal-line)}
.fg .hm{fill:var(--accent-ink)}.fg .sm{fill:var(--accent)}
.fg .hg2{fill:var(--teal-ink)}.fg .sg{fill:var(--teal)}
.fg .accent{fill:var(--accent)}.fg .teal{fill:var(--teal)}.fg .coral{fill:var(--coral)}
.fg .ar{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.fg .arh{fill:var(--faint)}
.fg .term{fill:var(--term);stroke:var(--term-line)}
.fg .tt{fill:#F1EFE8}.fg .tm{fill:#B4B2A9}.fg .tp{fill:#D97757;font-weight:700}.fg .tok{fill:#5DCAA5;font-weight:700}
.fg .lane{fill:var(--lane)}
.fg .spine{stroke:var(--rule);stroke-width:2;fill:none}
.fg .chev{fill:none;stroke:var(--rule);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fg .loop{fill:none;stroke:var(--coral);stroke-width:1.5;stroke-dasharray:5 5;opacity:.75}
.fg .ph{font-size:10.5px;font-weight:700;letter-spacing:1.6px;fill:var(--ink)}
.fg .ph.coral{fill:var(--coral)}.fg .ph.teal{fill:var(--teal)}
.fg .num{font-size:10.5px;font-weight:700;fill:var(--faint)}
.fg .cmd{font-size:10.5px}
.fg .ret{fill:none;stroke:var(--coral);stroke-width:1.7;stroke-linecap:round}
.fg .reth{fill:var(--coral)}
.fg .done{fill:var(--teal);stroke:var(--teal)}
.fg .doneh{fill:var(--bg)}.fg .dones{fill:var(--bg);opacity:.85}
.fg .tick{fill:none;stroke:var(--bg);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
</style>
<defs><filter id="plsh" x="-10%" y="-25%" width="120%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1b1b19" flood-opacity="0.09"/></filter><marker id="pla" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arh" d="M1 1.5L9 5L1 8.5z"/></marker></defs>
<rect class="lane" x="146" y="16" width="176" height="980" rx="14"/>
<rect class="lane" x="334" y="16" width="256" height="980" rx="14"/>
<rect class="lane" x="602" y="16" width="238" height="980" rx="14"/>
<text class="k mid teal" x="234" y="44">GITHUB</text><text class="mid" x="234" y="61">the pull request</text>
<text class="k mid " x="462" y="44">SCRIPTS</text><text class="mid" x="462" y="61">deterministic shell, zero tokens</text>
<text class="k mid accent" x="721" y="44">MODELS</text><text class="mid" x="721" y="61">isolated contexts, judgment only</text>
<path class="spine" d="M462 122V810"/>
<path class="spine" stroke-dasharray="3 5" d="M462 864V888"/>
<path class="chev" d="M458 132l4 4 4-4"/>
<path class="chev" d="M458 210l4 4 4-4"/>
<path class="chev" d="M458 288l4 4 4-4"/>
<path class="chev" d="M458 366l4 4 4-4"/>
<path class="chev" d="M458 454l4 4 4-4"/>
<path class="chev" d="M458 542l4 4 4-4"/>
<path class="chev" d="M458 620l4 4 4-4"/>
<path class="chev" d="M458 698l4 4 4-4"/>
<path class="chev" d="M458 786l4 4 4-4"/>
<rect class="loop" x="140.5" y="462" width="705" height="320" rx="14"/>
<g filter="url(#plsh)"><rect class="term" x="344" y="84" width="236" height="38" rx="9"/></g><text class="mono cmd tt" x="357" y="107"><tspan class="tp">›</tspan> /pr-review-workflow:review-pr 128</text>
<text x="24" y="101"><tspan class="num">0</tspan><tspan class="ph " dx="7">INVOKE</tspan></text><text x="24" y="118">one command</text>
<text x="24" y="171"><tspan class="num">1</tspan><tspan class="ph " dx="7">STAGE</tspan></text><text x="24" y="188">no model yet</text>
<g filter="url(#plsh)"><rect class="cg" x="156" y="146" width="156" height="54" rx="9"/></g><text class="h hg2" x="170" y="168">Pull request #128</text><text class="sg" x="170" y="185">diff and threads, once</text>
<path class="ar" d="M315 173.0H339" marker-end="url(#pla)"/>
<g filter="url(#plsh)"><rect class="c" x="344" y="146" width="236" height="54" rx="9"/></g><text class="h" x="358" y="168">Stage</text><text class="" x="358" y="185">fetch · probe · classify · check out</text>
<text x="24" y="249"><tspan class="num">2</tspan><tspan class="ph " dx="7">REVIEW</tspan></text><text x="24" y="266">once, thoroughly</text>
<g filter="url(#plsh)"><rect class="c" x="344" y="224" width="236" height="54" rx="9"/></g><text class="h" x="358" y="246">Plan the read</text><text class="" x="358" y="263">shards and seams for a large diff</text>
<path class="ar" d="M583 251.0H609" marker-end="url(#pla)"/>
<rect class="cm" x="622" y="232" width="206" height="54" rx="9"/>
<rect class="cm" x="618" y="228" width="206" height="54" rx="9"/>
<g filter="url(#plsh)"><rect class="cm" x="614" y="224" width="206" height="54" rx="9"/></g><text class="h hm" x="628" y="246">Reviewer</text><text class="sm" x="628" y="263">one pass, or up to four shards</text>
<g filter="url(#plsh)"><rect class="c" x="344" y="302" width="236" height="54" rx="9"/></g><text class="h" x="358" y="324">Bank the findings</text><text class="" x="358" y="341">one record each, ids assigned</text>
<path class="ar" d="M611 329.0H585" marker-end="url(#pla)"/>
<g filter="url(#plsh)"><rect class="cm" x="614" y="302" width="214" height="54" rx="9"/></g><text class="h hm" x="628" y="324">Gap pass</text><text class="sm" x="628" y="341">seams first, then what was missed</text>
<text x="24" y="405"><tspan class="num">3</tspan><tspan class="ph " dx="7">POST</tspan></text><text x="24" y="422">proof before posting</text>
<g filter="url(#plsh)"><rect class="cg" x="156" y="380" width="156" height="54" rx="9"/></g><text class="h hg2" x="170" y="402">Inline threads</text><text class="sg" x="170" y="419">one per finding</text>
<path class="ar" d="M341 407.0H317" marker-end="url(#pla)"/>
<g filter="url(#plsh)"><rect class="c" x="344" y="380" width="236" height="54" rx="9"/></g><text class="h" x="358" y="402">Prove and post</text><text class="" x="358" y="419">suggestions post only after passing</text>
<path class="ar" d="M583 407.0H609" marker-end="url(#pla)"/>
<g filter="url(#plsh)"><rect class="cm" x="614" y="380" width="214" height="54" rx="9"/></g><text class="h hm" x="628" y="402">Filter</text><text class="sm" x="628" y="419">a cold re-read: demote, never drop</text>
<text x="24" y="503"><tspan class="num">4</tspan><tspan class="ph coral" dx="7">FIX LOOP</tspan></text><text x="24" y="520">at most four rounds</text>
<path class="ret" d="M37.8 545.3A7.5 7.5 0 1 1 26 548.4"/><path class="reth" d="M29.2 544.5L29.2 550.3L22.1 549z"/>
<text x="50" y="547">open findings</text><text x="50" y="562">loop again</text>
<g filter="url(#plsh)"><rect class="cg" x="156" y="478" width="156" height="54" rx="9"/></g><text class="h hg2" x="170" y="500">Commits, replies</text><text class="sg" x="170" y="517">pushed to the PR branch</text>
<path class="ar" d="M341 505.0H317" marker-end="url(#pla)"/>
<g filter="url(#plsh)"><rect class="c" x="344" y="478" width="236" height="54" rx="9"/></g><text class="h" x="358" y="500">Open a round</text><text class="" x="358" y="517">the round budget lives on disk</text>
<path class="ar" d="M583 505.0H609" marker-end="url(#pla)"/>
<g filter="url(#plsh)"><rect class="cm" x="614" y="478" width="214" height="54" rx="9"/></g><text class="h hm" x="628" y="500">Editor</text><text class="sm" x="628" y="517">one commit per finding</text>
<g filter="url(#plsh)"><rect class="c" x="344" y="556" width="236" height="54" rx="9"/></g><text class="h" x="358" y="578">Check gate</text><text class="" x="358" y="595">the project’s own check must pass</text>
<g filter="url(#plsh)"><rect class="cg" x="156" y="634" width="156" height="54" rx="9"/></g><text class="h hg2" x="170" y="656">Threads resolved</text><text class="sg" x="170" y="673">or reopened, with notes</text>
<path class="ar" d="M341 661.0H317" marker-end="url(#pla)"/>
<g filter="url(#plsh)"><rect class="c" x="344" y="634" width="236" height="54" rx="9"/></g><text class="h" x="358" y="656">Run the contracts</text><text class="" x="358" y="673">Check lines execute, not prose</text>
<path class="ar" d="M583 661.0H609" marker-end="url(#pla)"/>
<g filter="url(#plsh)"><rect class="cm" x="614" y="634" width="214" height="54" rx="9"/></g><text class="h hm" x="628" y="656">Verifier</text><text class="sm" x="628" y="673">judges each Resolution verbatim</text>
<g filter="url(#plsh)"><rect class="c" x="344" y="712" width="236" height="54" rx="9"/></g><text class="h" x="358" y="734">Skim the round</text><text class="" x="358" y="751">unasked changes get their own review</text>
<text x="24" y="835"><tspan class="num">5</tspan><tspan class="ph teal" dx="7">MERGE</tspan></text><text x="24" y="852">after asking you</text>
<g filter="url(#plsh)"><rect class="done" x="156" y="810" width="156" height="54" rx="9"/></g><path class="tick" d="M171 829l3.5 3.5 6.5-7.5"/><text class="h doneh" x="189" y="833">Merged</text><text class="dones" x="170" y="850">rebase, proven merged</text>
<path class="ar" d="M341 837.0H317" marker-end="url(#pla)"/>
<g filter="url(#plsh)"><rect class="c" x="344" y="810" width="236" height="54" rx="9"/></g><text class="h" x="358" y="832">Merge gate</text><text class="" x="358" y="849">asks first unless auto-approve is on</text>
<g filter="url(#plsh)"><rect class="c" x="156" y="888" width="156" height="54" rx="9" stroke-dasharray="5 4"/></g><text class="h" x="170" y="910">Status comment</text><text class="" x="170" y="927">resumable later</text>
<path class="ar" stroke-dasharray="3 4" d="M341 915.0H317" marker-end="url(#pla)"/>
<g filter="url(#plsh)"><rect class="c" x="344" y="888" width="236" height="54" rx="9" stroke-dasharray="5 4"/></g><text class="h" x="358" y="910">Or park</text><text class="" x="358" y="927">the budget is spent: stop, never spin</text>
</svg>
