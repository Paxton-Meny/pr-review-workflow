<text class="ttl" x="24" y="30" style="font-size:16px">Stage</text>
<text x="24" y="49">Eleven scripts, no model, one line each. Everything the review will read is on disk before a model reads anything.</text>
<g filter="url(#ps-sh)"><rect class="term" x="24" y="62" width="812" height="130" rx="9"/></g>
<text class="mono tl tl0" x="36" y="82"><tspan class="tm">check-tools:</tspan> git and gh ready</text>
<text class="mono tl tl2" x="36" y="100"><tspan class="tm">settings:</tspan> resolved 24 default 21 user 1 project 1 local 1 run 0 ignored 0</text>
<text class="mono tl tl4" x="36" y="118"><tspan class="tm">fetch-pr:</tspan> 14 files, 612 additions, 88 deletions</text>
<text class="mono tl tl5" x="36" y="136"><tspan class="tm">probe-diff:</tspan> 2 sections (deps, sensitive)</text>
<text class="mono tl tl7" x="36" y="154"><tspan class="tm">scan-open-prs:</tspan> overlap: 2 candidates, 1 near, 0 same, approximate</text>
<text class="mono tl tl10" x="36" y="172"><tspan class="tm">run-check:</tspan> pass</text>
<text class="tm" x="826" y="186" text-anchor="end" style="font-size:9.5px">what the orchestrating session sees</text>
<text x="24" y="199"><tspan class="num">1</tspan><tspan class="ph" dx="7">LEDGER</tspan></text>
<text x="24" y="216"></text>
<g class="cardg st0" data-step="0"><rect class="c" x="24" y="216" width="186" height="70" rx="9"/>
<text class="h" x="36" y="236" style="font-size:12.5px">check-tools</text>
<text x="36" y="252" style="font-size:10.5px">git and an authenticated gh</text>
<text x="36" y="267" style="font-size:10.5px">nothing else is assumed</text>
</g>
<g class="cardg st1" data-step="1"><rect class="c" x="232" y="216" width="186" height="70" rx="9"/>
<text class="h" x="244" y="236" style="font-size:12.5px">init-state</text>
<text x="244" y="252" style="font-size:10.5px">the ledger directory, per PR</text>
<text x="244" y="267" style="font-size:10.5px">typed overrides, this run only</text>
</g>
<g class="cardg st2" data-step="2"><rect class="c" x="440" y="216" width="186" height="70" rx="9"/>
<text class="h" x="452" y="236" style="font-size:12.5px">resolve-settings</text>
<text x="452" y="252" style="font-size:10.5px">defaults · yours · project · local · run</text>
<text x="452" y="267" style="font-size:10.5px">a project may raise, add, or set</text>
</g>
<g class="cardg st3" data-step="3"><rect class="c" x="648" y="216" width="186" height="70" rx="9"/>
<text class="h" x="660" y="236" style="font-size:12.5px">sweep-state</text>
<text x="660" y="252" style="font-size:10.5px">reaps runs whose PR closed</text>
<text x="660" y="267" style="font-size:10.5px">prunes finished ledgers</text>
</g>
