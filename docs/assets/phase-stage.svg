<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 784" width="860" role="img" aria-labelledby="pst psd" class="ps">
<title id="pst">Phase 1, Stage: scripts set up one pull request with no model</title>
<desc id="psd">Eleven scripts run in order with no model: the tools are checked, the ledger directory is created, settings are resolved from five sources with a project file allowed only to raise, add, or set, closed runs are swept, the diff is fetched from the API or built from the clone when the API refuses it and split into annotated per-file diffs, deterministic probes and a size classification run over it, open pull requests touching the same hunks are named, a detached worktree is checked out with the base snapshot and the conventions block, local standards are gathered, and the project's own check runs once as the baseline that arms the fix loop's gate. A terminal strip shows the one line each script prints; a ledger strip shows what each writes.</desc>
