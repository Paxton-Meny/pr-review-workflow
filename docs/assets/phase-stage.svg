<text x="325" y="505.5" text-anchor="middle" style="font-size:10.5px">a hit is a lead, never a finding</text>
</g>
<g class="chip ask ex7"><rect x="644.149" y="468" width="189.851" height="19" rx="9.5"/>
<text x="739.075" y="481.5" text-anchor="middle" style="font-size:10.5px">near or same → continue, or stop?</text>
</g>
<text x="24" y="543"><tspan class="num">3</tspan><tspan class="ph" dx="7">CHECK OUT</tspan></text>
<text x="24" y="560"></text>
<g class="cardg st8" data-step="8"><rect class="c" x="24" y="560" width="186" height="70" rx="9"/>
<text class="h" x="36" y="580" style="font-size:12.5px">checkout-pr</text>
<text x="36" y="596" style="font-size:10.5px">a detached worktree at the head</text>
<text x="36" y="611" style="font-size:10.5px">base snapshot · conventions block</text>
</g>
<g class="cardg st9" data-step="9"><rect class="c" x="232" y="560" width="186" height="70" rx="9"/>
<text class="h" x="244" y="580" style="font-size:12.5px">extract-standards</text>
<text x="244" y="596" style="font-size:10.5px">your untracked rule files</text>
<text x="244" y="611" style="font-size:10.5px">substance in, names never out</text>
</g>
<g class="cardg st10" data-step="10"><rect class="c" x="440" y="560" width="186" height="70" rx="9"/>
<text class="h" x="452" y="580" style="font-size:12.5px">run-check --baseline</text>
<text x="452" y="596" style="font-size:10.5px">the project’s own check, once</text>
<text x="452" y="611" style="font-size:10.5px">a pass arms the fix loop’s gate</text>
</g>
<g class="cardg st11" data-step="11"><rect class="done" x="648" y="560" width="186" height="70" rx="9"/>
<text class="h doneh" x="660" y="580" style="font-size:12.5px">Staged</text>
<text class="dones" x="660" y="596" style="font-size:10.5px">every input on disk;</text>
<text class="dones" x="660" y="611" style="font-size:10.5px">the reviewer is next</text>
</g>
