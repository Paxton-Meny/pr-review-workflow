<text x="533" y="309.5" text-anchor="middle" style="font-size:10.5px">trust pending: a command from the project file → you approve it</text>
</g>
<text x="24" y="371"><tspan class="num">2</tspan><tspan class="ph" dx="7">READ</tspan></text>
<text x="24" y="388"></text>
<g class="cardg st4" data-step="4"><rect class="c" x="24" y="388" width="186" height="70" rx="9"/>
<text class="h" x="36" y="408" style="font-size:12.5px">fetch-pr · split-diff</text>
<text x="36" y="424" style="font-size:10.5px">diff, body, files, from the API</text>
<text x="36" y="439" style="font-size:10.5px">per-file diffs, lines numbered</text>
</g>
<g class="cardg st5" data-step="5"><rect class="c" x="232" y="388" width="186" height="70" rx="9"/>
<text class="h" x="244" y="408" style="font-size:12.5px">probe-diff</text>
