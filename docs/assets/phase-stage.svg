<text x="244" y="439" style="font-size:10.5px">schema · deps · debug · markers</text>
</g>
<g class="cardg st6" data-step="6"><rect class="c" x="440" y="388" width="186" height="70" rx="9"/>
<text class="h" x="452" y="408" style="font-size:12.5px">classify-change</text>
<text x="452" y="424" style="font-size:10.5px">kind: code, docs, config, tests</text>
<text x="452" y="439" style="font-size:10.5px">lines and code lines, for routing</text>
</g>
<g class="cardg st7" data-step="7"><rect class="c" x="648" y="388" width="186" height="70" rx="9"/>
<text class="h" x="660" y="408" style="font-size:12.5px">scan-open-prs</text>
<text x="660" y="424" style="font-size:10.5px">open PRs on the same base</text>
<text x="660" y="439" style="font-size:10.5px">hunks within 12 lines or a function</text>
</g>
