<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 640" width="860" role="img" aria-labelledby="plt pld" class="pl">
<title id="plt">Phase 5, Land: checks awaited, the base followed, failures repaired</title>
<desc id="pld">After convergence the run decides the merge method, since an update follows it; brings the branch up to date when the forge reports it conflicting or behind a base that requires it, by a rebase with a leased push or a merge of the base, at most three times, handing conflicts to a person or, when allowed, to the editor; waits for the head's checks in slices under a wait budget kept on disk, rerunning a cancelled run once; and on a failed check writes a digest for the editor, who diagnoses, posts a paragraph, repairs, and pushes, a repeated failure escalating one lever, repairs capped, every repair reviewed, and the loop returning to the start until the checks pass.</desc>
<style>
.pl{--bg:#FDFCFA;--card:#FFFFFF;--panel:#F1EFE8;--lane:#F6F4EE;--ink:#2C2C2A;--muted:#5F5E5A;--faint:#8b8a83;--line:#E4E2D8;--rule:#C9C7BE;--accent:#534AB7;--accent-bg:#EEEDFE;--accent-ink:#26215C;--accent-line:#B9B4EA;--teal:#0F6E56;--teal-bg:#E1F5EE;--teal-ink:#04342C;--teal-line:#8FCDB8;--coral:#993C1D;--coral-bg:#FAECE7;--coral-ink:#4A1B0C;--coral-line:#F0B9A5;--clay:#D97757;--term:#2C2C2A;--term-line:#2C2C2A}
@media (prefers-color-scheme:dark){.pl{--bg:#1E1E1C;--card:#2C2C2A;--panel:#383835;--lane:#232321;--ink:#F1EFE8;--muted:#B4B2A9;--faint:#8b8a83;--line:#44433F;--rule:#5F5E5A;--accent:#AFA9EC;--accent-bg:#2F2A6B;--accent-ink:#E4E2FB;--accent-line:#534AB7;--teal:#5DCAA5;--teal-bg:#0a3f33;--teal-ink:#C9F0E2;--teal-line:#0F6E56;--coral:#F0997B;--coral-bg:#4a2214;--coral-ink:#F5C4B3;--coral-line:#7a3a24;--clay:#D97757;--term:#141413;--term-line:#44433F}}
.pl text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:11.5px;fill:var(--muted)}
.pl .mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
.pl .serif{font-family:'Iowan Old Style',Palatino,Georgia,serif}
.pl .h{font-size:12.5px;font-weight:700;fill:var(--ink)}
.pl .k{font-size:10.5px;font-weight:700;letter-spacing:1.6px;fill:var(--ink)}
.pl .ttl{font-size:16px;font-weight:700;fill:var(--ink)}
.pl .c{fill:var(--card);stroke:var(--line)}
.pl .cm{fill:var(--accent-bg);stroke:var(--accent-line)}
.pl .cg{fill:var(--teal-bg);stroke:var(--teal-line)}
.pl .cp{fill:var(--coral-bg);stroke:var(--coral-line)}
.pl .hm{fill:var(--accent-ink)}.pl .sm{fill:var(--accent)}
.pl .hg2{fill:var(--teal-ink)}.pl .sg{fill:var(--teal)}
.pl .hp{fill:var(--coral-ink)}.pl .sp{fill:var(--coral)}
.pl .accent{fill:var(--accent)}.pl .teal{fill:var(--teal)}.pl .coral{fill:var(--coral)}
.pl .ar{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.pl .arh{fill:var(--faint)}
.pl .ring{fill:none;stroke:var(--rule);stroke-width:3}
.pl .term{fill:var(--term);stroke:var(--term-line)}
.pl .tl{fill:#F1EFE8}.pl .tm{fill:#B4B2A9}
.pl .lane{fill:var(--lane)}
.pl .ph{font-size:10.5px;font-weight:700;letter-spacing:1.6px;fill:var(--ink)}
.pl .num{font-size:10.5px;font-weight:700;fill:var(--faint)}
.pl .chip rect{stroke-width:1}.pl .chip text{font-weight:700;fill:var(--ink)}
.pl .bad rect{fill:var(--coral-bg);stroke:var(--coral-line)}.pl .bad text{fill:var(--coral-ink)}
.pl .ask rect{fill:var(--card);stroke:var(--coral)}.pl .ask text{fill:var(--coral)}
.pl .good rect{fill:var(--teal-bg);stroke:var(--teal-line)}.pl .good text{fill:var(--teal-ink)}
.pl .note rect{fill:var(--panel);stroke:var(--line)}.pl .note text{fill:var(--muted)}
.pl .mdl rect{fill:var(--accent-bg);stroke:var(--accent-line)}.pl .mdl text{fill:var(--accent-ink)}
.pl .lf rect{fill:var(--rule)}.pl .lf text{fill:var(--muted)}
.pl .done{fill:var(--teal);stroke:var(--teal)}
.pl .doneh{fill:var(--bg)}.pl .dones{fill:var(--bg);opacity:.85}
.pl .tick{fill:none;stroke:var(--bg);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pl .cardg>rect{stroke-width:1}
@keyframes pl-walk{0%,9.4%{offset-distance:0.00%}17.0%,26.4%{offset-distance:18.99%}34.0%,45.6%{offset-distance:38.60%}55.0%,64.4%{offset-distance:56.88%}72.0%,80.8%{offset-distance:75.16%}88.0%,100%{offset-distance:100.00%}}
.pl .tok{fill:var(--clay);stroke:var(--card);stroke-width:2.5;offset-path:path('M112 241 L326 241 L547 241 L753 241 L547 241 L547 521');offset-rotate:0deg;animation:pl-walk 30s linear infinite}
@keyframes pl-st0{0%,0.0%{stroke:var(--line);stroke-width:1}0.0%,16.9%{stroke:var(--accent);stroke-width:2}17.0%,100%{stroke:var(--line);stroke-width:1}}
.pl .st0>rect{animation:pl-st0 30s linear infinite}
@keyframes pl-in0{0%,0.0%{opacity:0}0.5%,100%{opacity:1}}
.pl .tl0,.pl .lf0{animation:pl-in0 30s linear infinite}
@keyframes pl-st1{0%,16.9%{stroke:var(--line);stroke-width:1}17.0%,33.9%{stroke:var(--accent);stroke-width:2}34.0%,100%{stroke:var(--line);stroke-width:1}}
.pl .st1>rect{animation:pl-st1 30s linear infinite}
@keyframes pl-in1{0%,16.9%{opacity:0}17.5%,100%{opacity:1}}
.pl .tl1,.pl .lf1{animation:pl-in1 30s linear infinite}
@keyframes pl-st2{0%,33.9%{stroke:var(--line);stroke-width:1}34.0%,54.9%{stroke:var(--accent);stroke-width:2}55.0%,100%{stroke:var(--line);stroke-width:1}}
.pl .st2>rect{animation:pl-st2 30s linear infinite}
@keyframes pl-in2{0%,33.9%{opacity:0}34.5%,100%{opacity:1}}
.pl .tl2,.pl .lf2{animation:pl-in2 30s linear infinite}
@keyframes pl-st3{0%,54.9%{stroke:var(--line);stroke-width:1}55.0%,87.9%{stroke:var(--accent);stroke-width:2}88.0%,100%{stroke:var(--line);stroke-width:1}}
.pl .st3>rect{animation:pl-st3 30s linear infinite}
@keyframes pl-in3{0%,54.9%{opacity:0}55.5%,100%{opacity:1}}
.pl .tl3,.pl .lf3{animation:pl-in3 30s linear infinite}
@keyframes pl-st4{0%,87.9%{stroke:var(--line);stroke-width:1}88.0%,99.9%{stroke:var(--accent);stroke-width:2}100.0%,100%{stroke:var(--line);stroke-width:1}}
.pl .st4>rect{animation:pl-st4 30s linear infinite}
@keyframes pl-in4{0%,87.9%{opacity:0}88.5%,100%{opacity:1}}
.pl .tl4,.pl .lf4{animation:pl-in4 30s linear infinite}
@keyframes pl-ex2{0%,39.9%{opacity:.35}40.0%,54.9%{opacity:1}55.0%,100%{opacity:.35}}
.pl .ex2{animation:pl-ex2 30s linear infinite}
@keyframes pl-ex4{0%,87.9%{opacity:.35}88.0%,99.9%{opacity:1}100.0%,100%{opacity:.35}}
.pl .ex4{animation:pl-ex4 30s linear infinite}
@media (prefers-reduced-motion:reduce){.pl *{animation:none!important}.pl .tok{display:none}.pl .tl,.pl .lf,.pl .ex0,.pl .ex1,.pl .ex2,.pl .ex3,.pl .ex4,.pl .ex5,.pl .ex6,.pl .ex7,.pl .ex8,.pl .ex9,.pl .ex10,.pl .ex11{opacity:1}}
</style>
<defs><filter id="pl-sh" x="-10%" y="-25%" width="120%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1b1b19" flood-opacity="0.09"/></filter><marker id="pl-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arh" d="M1 1.5L9 5L1 8.5z"/></marker></defs>
<text class="ttl" x="24" y="30" style="font-size:16px">Land</text>
<text x="24" y="49">Between a clean ledger and the merge gate: the base keeps moving and the checks have the last word.</text>
<g filter="url(#pl-sh)"><rect class="term" x="24" y="62" width="812" height="130" rx="9"/></g>
<text class="mono tl tl0" x="36" y="82"><tspan class="tm">merge-method:</tspan> rebase reason allowed-only</text>
<text class="mono tl tl1" x="36" y="100"><tspan class="tm">sync-branch:</tspan> current</text>
<text class="mono tl tl2" x="36" y="118"><tspan class="tm">await-checks:</tspan> pending 2 of 3, call again</text>
<text class="mono tl tl2" x="36" y="136"><tspan class="tm">await-checks:</tspan> fail 1 of 3: tests; signature new</text>
<text class="mono tl tl3" x="36" y="154"><tspan class="tm">route</tspan> ci-repair all rung base model inherit effort high reason ci-failed</text>
<text class="mono tl tl4" x="36" y="172"><tspan class="tm">await-checks:</tspan> pass 3 checks</text>
<text class="tm" x="826" y="186" text-anchor="end" style="font-size:9.5px">what the orchestrating session sees</text>
<g class="cardg st0" data-step="0"><rect class="c" x="24" y="206" width="176" height="70" rx="9"/>
<text class="h" x="36" y="226" style="font-size:12.5px">merge-method</text>
<text x="36" y="242" style="font-size:10.5px">setting, else the repo’s one</text>
<text x="36" y="257" style="font-size:10.5px">method, else recent history</text>
</g>
<g class="cardg st1" data-step="1"><rect class="c" x="228" y="206" width="196" height="70" rx="9"/>
<text class="h" x="240" y="226" style="font-size:12.5px">sync-branch</text>
<text x="240" y="242" style="font-size:10.5px">only when conflicting or behind</text>
<text x="240" y="257" style="font-size:10.5px">by the method; at most three</text>
</g>
<g class="cardg st2" data-step="2"><rect class="c" x="452" y="206" width="190" height="70" rx="9"/>
<text class="h" x="464" y="226" style="font-size:12.5px">await-checks</text>
<text x="464" y="242" style="font-size:10.5px">slices under a wait budget</text>
<text x="464" y="257" style="font-size:10.5px">a cancelled run rerun once</text>
</g>
<g class="cardg st3" data-step="3"><rect class="cm" x="670" y="206" width="166" height="70" rx="9"/>
<text class="h hm" x="682" y="226" style="font-size:12.5px">Editor</text>
<text class="sm" x="682" y="242" style="font-size:10.5px">reads the digest, repairs,</text>
<text class="sm" x="682" y="257" style="font-size:10.5px">posts its paragraph, pushes</text>
</g>
<path class="ar" d="M200 241 L226 241" marker-end="url(#pl-a)"/>
<path class="ar" d="M424 241 L450 241" marker-end="url(#pl-a)"/>
<path class="ar" d="M642 241 L668 241" marker-end="url(#pl-a)"/>
<path class="ar" d="M753 276 L753 306 L112 306 L112 278" marker-end="url(#pl-a)"/>
<text x="432" y="302" text-anchor="middle" style="font-size:10.5px">a repair loops back: the base may have moved while the checks ran</text>
<g class="cardg"><rect class="c" x="24" y="326" width="176" height="118" rx="9"/>
<text class="h" x="36" y="346" style="font-size:12.5px">Mixed history</text>
<text x="36" y="362" style="font-size:10.5px">exit 4 → you pick one of</text>
<text x="36" y="377" style="font-size:10.5px">the allowed methods</text>
<text x="36" y="392" style="font-size:10.5px">squash and merge mean a</text>
<text x="36" y="407" style="font-size:10.5px">merge of the base; rebase</text>
<text x="36" y="422" style="font-size:10.5px">means a leased push</text>
</g>
<g class="cardg"><rect class="c" x="228" y="326" width="196" height="118" rx="9"/>
<text class="h" x="240" y="346" style="font-size:12.5px">sync-branch exits</text>
<text x="240" y="362" style="font-size:10.5px">0: current, or updated</text>
<text x="240" y="377" style="font-size:10.5px">3: conflicts → a person; under</text>
<text x="240" y="392" style="font-size:10.5px">resolve, the editor, then review</text>
<text x="240" y="407" style="font-size:10.5px">4: off, or a base that keeps</text>
<text x="240" y="422" style="font-size:10.5px">moving → a person; hold or park</text>
</g>
<g class="cardg"><rect class="c" x="452" y="326" width="190" height="118" rx="9"/>
<text class="h" x="464" y="346" style="font-size:12.5px">await-checks exits</text>
<text x="464" y="362" style="font-size:10.5px">0: pass → the merge gate</text>
<text x="464" y="377" style="font-size:10.5px">5: pending → call again</text>
<text x="464" y="392" style="font-size:10.5px">6: budget spent → extend or hold</text>
<text x="464" y="407" style="font-size:10.5px">3: failed → the digest, then</text>
<text x="464" y="422" style="font-size:10.5px">repair under fix; comment under wait</text>
</g>
<g class="cardg"><rect class="c" x="670" y="326" width="166" height="118" rx="9"/>
<text class="h" x="682" y="346" style="font-size:12.5px">The repair</text>
<text x="682" y="362" style="font-size:10.5px">same failure → one lever up</text>
<text x="682" y="377" style="font-size:10.5px">ci_fix_rounds caps it (2)</text>
<text x="682" y="392" style="font-size:10.5px">then the check gate, then</text>
<text x="682" y="407" style="font-size:10.5px">round-diff --all: every file</text>
<text x="682" y="422" style="font-size:10.5px">the repair touched is reviewed</text>
</g>
<g class="chip note ex2"><rect x="24" y="458" width="182.357" height="19" rx="9.5"/>
<text x="115.178" y="471.5" text-anchor="middle" style="font-size:10.5px">no checks reported → straight on</text>
</g>
<g class="chip good ex4"><rect x="702.347" y="458" width="133.653" height="19" rx="9.5"/>
<text x="769.173" y="471.5" text-anchor="middle" style="font-size:10.5px">pass → the merge gate</text>
</g>
<g class="cardg st4" data-step="4"><rect class="done" x="452" y="494" width="190" height="54" rx="9"/>
<text class="h doneh" x="464" y="514" style="font-size:12.5px">Checks green</text>
<text class="dones" x="464" y="530" style="font-size:10.5px">the branch is current</text>
</g>
<path class="ar" d="M547 444 L547 492" marker-end="url(#pl-a)"/>
<rect class="lane" x="24" y="562" width="812" height="64" rx="9"/>
<text class="k" x="36" y="579" style="font-size:9.5px">written to the ledger</text>
<g class="lf lf0"><rect x="36" y="590" width="8" height="8" rx="2"/><text class="mono" x="49" y="598" style="font-size:10px">pr-context/merge-method.txt</text></g>
<g class="lf lf1"><rect x="227.54" y="590" width="8" height="8" rx="2"/><text class="mono" x="240.54" y="598" style="font-size:10px">sync-changed.txt</text></g>
<g class="lf lf2"><rect x="352.86" y="590" width="8" height="8" rx="2"/><text class="mono" x="365.86" y="598" style="font-size:10px">ci-wait.txt</text></g>
<g class="lf lf2"><rect x="448.08" y="590" width="8" height="8" rx="2"/><text class="mono" x="461.08" y="598" style="font-size:10px">ci-attempts.txt</text></g>
<g class="lf lf3"><rect x="567.38" y="590" width="8" height="8" rx="2"/><text class="mono" x="580.38" y="598" style="font-size:10px">ci-failure.txt</text></g>
<g class="lf lf3"><rect x="680.66" y="590" width="8" height="8" rx="2"/><text class="mono" x="693.66" y="598" style="font-size:10px">ci-rounds.txt</text></g>
<g class="lf lf3"><rect x="36" y="608" width="8" height="8" rx="2"/><text class="mono" x="49" y="616" style="font-size:10px">a comment on the PR</text></g>
<circle class="tok" r="7"/>
</svg>
