<text class="ttl" x="24" y="30" style="font-size:16px">Merge</text>
<text x="24" y="49">Every refusal writes nothing and names who decides. The merge is the only step that cannot be undone.</text>
<g filter="url(#pm-sh)"><rect class="term" x="24" y="62" width="812" height="148" rx="9"/></g>
<text class="mono tl tl0" x="36" y="82"><tspan class="tm">merge-method:</tspan> rebase reason setting</text>
<text class="mono tl tl5" x="36" y="100"><tspan class="tm">base-drift:</tspan> 2 commits landed, 1 files shared, level disjoint</text>
<text class="mono tl tl6" x="36" y="118"><tspan class="tm">merge-pr:</tspan> Paxton-Meny/api#128 merged by rebase, branch deleted</text>
<text class="mono tl tl7" x="36" y="136"><tspan class="tm">run-stats:</tspan> run Paxton-Meny/api#128 outcome merged rounds 2 findings 5 verified 5 …</text>
<text class="mono tl tl7" x="36" y="154"><tspan class="tm">cleanup-state:</tspan> worktree and context removed, ledger kept</text>
<text class="mono tl tl7" x="36" y="172"><tspan class="tm">sweep-state:</tspan> stale 0 pruned 1 kept 20</text>
<text class="mono tl tl7" x="36" y="190"><tspan class="tm">criteria-signals:</tspan> other 1 notes 1</text>
<text class="tm" x="826" y="204" text-anchor="end" style="font-size:9.5px">what the orchestrating session sees</text>
<g class="cardg st0" data-step="0"><rect class="c" x="24" y="220" width="250" height="70" rx="9"/>
<text class="h" x="36" y="240" style="font-size:12.5px">merge-method --refresh</text>
<text x="36" y="256" style="font-size:10.5px">setting · the repo’s one method</text>
<text x="36" y="271" style="font-size:10.5px">· recent history, same shape first</text>
</g>
<g class="chip ask ex0"><rect x="24" y="298" width="203.58" height="19" rx="9.5"/>
<text x="125.79" y="311.5" text-anchor="middle" style="font-size:10.5px">mixed evidence → you pick a method</text>
</g>
<g class="cardg st1" data-step="1"><rect class="c" x="304" y="220" width="260" height="70" rx="9"/>
<text class="h" x="316" y="240" style="font-size:12.5px">Who opens the gate</text>
<text x="316" y="256" style="font-size:10.5px">auto-approve → merges on its own</text>
<text x="316" y="271" style="font-size:10.5px">attended → merge now, or hold?</text>
</g>
<g class="chip note ex1"><rect x="304" y="298" width="252.317" height="19" rx="9.5"/>
<text x="430.159" y="311.5" text-anchor="middle" style="font-size:10.5px">unattended, auto-approve off → comment, stop</text>
</g>
<path class="ar" d="M274 255 L302 255" marker-end="url(#pm-a)"/>
<g class="cardg st2" data-step="2"><rect class="c" x="304" y="340" width="260" height="56" rx="9"/>
<text class="h" x="316" y="360" style="font-size:12.5px">Open, not a draft</text>
<text x="316" y="376" style="font-size:10.5px">else nothing happens</text>
</g>
<g class="cardg st3" data-step="3"><rect class="c" x="304" y="420" width="260" height="56" rx="9"/>
<text class="h" x="316" y="440" style="font-size:12.5px">Mergeable</text>
<text x="316" y="456" style="font-size:10.5px">the forge’s own verdict</text>
</g>
<g class="chip bad ex3"><rect x="573.021" y="438" width="262.979" height="19" rx="9.5"/>
<text x="704.51" y="451.5" text-anchor="middle" style="font-size:10.5px">CONFLICTING or BEHIND → exit 5 → base sync</text>
</g>
<path class="ar" d="M564 448 L584 448" marker-end="url(#pm-a)"/>
<g class="cardg st4" data-step="4"><rect class="c" x="304" y="500" width="260" height="56" rx="9"/>
<text class="h" x="316" y="520" style="font-size:12.5px">No migration files</text>
<text x="316" y="536" style="font-size:10.5px">or the forge listed too few files</text>
</g>
<g class="chip ask ex4"><rect x="656.16" y="518" width="179.84" height="19" rx="9.5"/>
<text x="746.08" y="531.5" text-anchor="middle" style="font-size:10.5px">exit 4 → four checks you confirm</text>
</g>
<path class="ar" d="M564 528 L584 528" marker-end="url(#pm-a)"/>
