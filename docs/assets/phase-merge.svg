<text class="h" x="316" y="600" style="font-size:12.5px">Nothing landed beside the hunks</text>
<text x="316" y="616" style="font-size:10.5px">base fetched, compared in place</text>
</g>
<g class="chip ask ex5"><rect x="607.962" y="598" width="228.038" height="19" rx="9.5"/>
<text x="721.981" y="611.5" text-anchor="middle" style="font-size:10.5px">near or same → exit 6 → drift lines, verdict</text>
</g>
