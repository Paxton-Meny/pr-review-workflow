<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 860" width="860" role="img" aria-labelledby="pmt pmd" class="pm">
<title id="pmt">Phase 6, Merge: four doors, then the merge and the bookkeeping</title>
<desc id="pmd">The merge method is refreshed: the setting, else the one method the repository allows, else the one its recent merged pull requests used, and mixed evidence asks a person. Auto-approve merges on its own; attended, the user is asked to merge or hold; unattended, a converged status comment is posted and nothing merges. merge-pr then passes four doors in order and writes nothing when one refuses: the pull request must be open and not a draft; mergeable, or exit 5 sends the run back to base sync; free of migration files, or exit 4 hands a person four checks to confirm; and clear of commits landed beside the reviewed hunks, or exit 6 shows the drift lines and any verdict for a person to decide. The merge runs by the decided method with the head matched, the branch is deleted or kept with the reason, and the run records its statistics, drops the worktree, sweeps closed runs, and reports with its criteria signals.</desc>
