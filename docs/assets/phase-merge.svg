<text class="h doneh" x="316" y="680" style="font-size:12.5px">Merged</text>
<text class="dones" x="316" y="696" style="font-size:10.5px">by the method, head matched</text>
</g>
<path class="ar" d="M434 636 L434 658" marker-end="url(#pm-a)"/>
<g class="chip note ex6"><rect x="497.083" y="722" width="338.917" height="19" rx="9.5"/>
<text x="666.542" y="735.5" text-anchor="middle" style="font-size:10.5px">--migrations-checked · --overlap-checked: only after your answer</text>
</g>
<g class="chip good ex5"><rect x="531.856" y="642" width="304.144" height="19" rx="9.5"/>
<text x="683.928" y="655.5" text-anchor="middle" style="font-size:10.5px">an independent verdict on that base → merges on its own</text>
</g>
<g class="cardg"><rect class="c" x="24" y="340" width="250" height="136" rx="9"/>
<text class="h" x="36" y="360" style="font-size:12.5px">The branch afterwards</text>
<text x="36" y="376" style="font-size:10.5px">deleted, unless it is a fork’s,</text>
<text x="36" y="391" style="font-size:10.5px">the repository deletes it itself,</text>
<text x="36" y="406" style="font-size:10.5px">or an open pull request bases on it</text>
<text x="36" y="421" style="font-size:10.5px">(a stacked branch stays)</text>
<text x="36" y="436" style="font-size:10.5px">the line says which, and why</text>
</g>
<g class="cardg"><rect class="c" x="24" y="500" width="250" height="136" rx="9"/>
<text class="h" x="36" y="520" style="font-size:12.5px">What the person confirms</text>
<text x="36" y="536" style="font-size:10.5px">migrations: no newer ones on the base,</text>
<text x="36" y="551" style="font-size:10.5px">none in other open pull requests,</text>
<text x="36" y="566" style="font-size:10.5px">running code still works, nothing</text>
<text x="36" y="581" style="font-size:10.5px">shipped was edited</text>
<text x="36" y="596" style="font-size:10.5px">overlap: the drift lines, the verdict</text>
</g>
<g class="cardg st7" data-step="7"><rect class="c" x="24" y="744" width="182" height="54" rx="9"/>
<text class="h" x="36" y="764" style="font-size:12.5px">run-stats</text>
<text x="36" y="780" style="font-size:10.5px">one line per finished run</text>
</g>
<g class="cardg st7" data-step="7"><rect class="c" x="230" y="744" width="182" height="54" rx="9"/>
<text class="h" x="242" y="764" style="font-size:12.5px">cleanup-state</text>
<text x="242" y="780" style="font-size:10.5px">worktree gone, ledger kept</text>
</g>
<g class="cardg st7" data-step="7"><rect class="c" x="436" y="744" width="182" height="54" rx="9"/>
