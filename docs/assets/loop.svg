<circle class="nd" cx="280" cy="304" r="6.5"/>
<circle class="nd" cx="315.1" cy="219.1" r="6.5"/>
<circle class="nd" cx="400" cy="184" r="6.5"/>
<circle class="nd" cx="484.9" cy="219.1" r="6.5"/>
<circle class="nd" cx="520" cy="304" r="6.5"/>
<circle class="nd" cx="400" cy="424" r="6.5"/>
<g filter="url(#lpsh)"><rect class="cm" x="30" y="273" width="166" height="62" rx="9"/></g><text class="h hm" x="44" y="291.5">First review</text><text class="sm" x="44" y="308.5">every finding carries</text><text class="sm" x="44" y="323.5">a testable contract</text>
<text class="mid" x="238" y="294">open findings</text>
<g filter="url(#lpsh)"><rect class="cm" x="146" y="150" width="156" height="54" rx="9"/></g><text class="h hm" x="160" y="172">Editor</text><text class="sm" x="160" y="189">a commit per finding</text>
<g filter="url(#lpsh)"><rect class="c" x="318" y="96" width="164" height="54" rx="9"/></g><text class="h" x="332" y="118">Check gate</text><text class="" x="332" y="135">the project’s check passes</text>
<g filter="url(#lpsh)"><rect class="cm" x="498" y="150" width="172" height="54" rx="9"/></g><text class="h hm" x="512" y="172">Verifier</text><text class="sm" x="512" y="189">contracts run, then judged</text>
<text class="h" x="538" y="292">Anything open?</text>
<g class="chip bad"><rect x="538" y="316" width="88" height="19" rx="9.5"/><text x="582" y="329.5">1 reopened</text></g>
<g class="chip good"><rect x="538" y="316" width="62" height="19" rx="9.5"/><text x="569" y="329.5">0 open</text></g>
<g filter="url(#lpsh)"><rect class="done" x="690" y="274" width="146" height="60" rx="9"/></g><path class="tick" d="M705 296l3.5 3.5 6.5-7.5"/><text class="h doneh" x="723" y="300">Merged</text><text class="dones" x="704" y="318">rebase, proven</text>
<g filter="url(#lpsh)"><rect class="c" x="318" y="446" width="164" height="54" rx="9"/></g><text class="h" x="332" y="468">Round counter</text><text class="" x="332" y="485">the budget, kept on disk</text>
<g filter="url(#lpsh)"><rect class="c" x="560" y="446" width="172" height="54" rx="9" stroke-dasharray="5 4"/></g><text class="h" x="574" y="468">Parked</text><text class="" x="574" y="485">budget spent; trail kept</text>
<text class="coral" x="506" y="382">reopened:</text><text class="coral" x="506" y="397">go around again</text>
<text class="k mid" x="400" y="266" style="fill:var(--faint)">ROUND</text>
<text class="serif rn r1" x="400" y="321">1</text><text class="serif rn r2" x="400" y="321">2</text>
<circle class="pip pf" cx="370" cy="342" r="5"/>
<circle class="pip pf p2" cx="390" cy="342" r="5"/>
<circle class="pip" cx="410" cy="342" r="5"/>
<circle class="pip" cx="430" cy="342" r="5"/>
<text class="mid" x="400" y="366">of four</text>
<text class="mid" x="430" y="538">The goal is one lap: contracts, banked fixes, and the filter exist to make the first pass the last.</text>
<circle class="tok" r="8"/>
</svg>
