<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" role="img" aria-labelledby="lt ld">
<title id="lt">The review loop, from above</title>
<desc id="ld">One thorough review feeds a cycle: editor, gate and verifier, then a decision. A reopened finding sends the flow around again; a clean verdict exits to a proven merge. The budget allows four rounds before parking, and the animation shows a run converging on its second lap.</desc>
<style>
text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.th{font-size:13px;font-weight:700}.ts{font-size:9.5px}.tl{font-size:10px;font-weight:600}
.g{fill:#F1EFE8;stroke:#5F5E5A}.p{fill:#EEEDFE;stroke:#534AB7}.te{fill:#E1F5EE;stroke:#0F6E56}
.tg{fill:#2C2C2A}.tg2{fill:#5F5E5A}.tp{fill:#26215C}.tp2{fill:#534AB7}.tt{fill:#04342C}.tt2{fill:#0F6E56}.tc{fill:#993C1D}
.arc{fill:none;stroke:#888780;stroke-width:2.5;stroke-dasharray:7 6;animation:crawl 1.1s linear infinite}
.arcb{stroke:#993C1D}
.exit{fill:none;stroke:#0F6E56;stroke-width:2.5;stroke-dasharray:7 6;animation:crawl 1.1s linear infinite,exitglow 22s linear infinite}
.parkp{fill:none;stroke:#888780;stroke-width:2;stroke-dasharray:3 5;opacity:.55}
.tok{fill:#D97757;stroke:#FAF9F5;stroke-width:2.5;offset-path:path('M120 151 C 260 118 410 136 500 165 A135 135 0 0 1 635 300 A135 135 0 0 1 500 435 A135 135 0 0 1 365 300 A135 135 0 0 1 500 165 A135 135 0 0 1 635 300 A135 135 0 0 1 500 435 A135 135 0 0 1 365 300 L 215 300');offset-rotate:0deg;animation:travel 22s cubic-bezier(.4,0,.3,1) infinite}
.pipc{fill:none;stroke:#993C1D;stroke-width:1.5}
.pip1{animation:fill1 22s linear infinite}
.pip2{animation:fill2 22s linear infinite}
.vbad{opacity:0;animation:vbad 22s linear infinite}
.vgood{opacity:0;animation:vgood 22s linear infinite}
@keyframes crawl{to{stroke-dashoffset:-13}}
@keyframes travel{
0%{offset-distance:0%}6%{offset-distance:0%}
12%{offset-distance:19.5%}16%{offset-distance:19.5%}
20%{offset-distance:29.9%}24%{offset-distance:29.9%}
28%{offset-distance:40.4%}32%{offset-distance:40.4%}
36%{offset-distance:50.8%}44%{offset-distance:50.8%}
50%{offset-distance:61.3%}53%{offset-distance:61.3%}
57%{offset-distance:71.7%}60%{offset-distance:71.7%}
64%{offset-distance:82.2%}67%{offset-distance:82.2%}
71%{offset-distance:92.6%}79%{offset-distance:92.6%}
85%{offset-distance:100%}100%{offset-distance:100%}}
@keyframes vbad{0%,37%{opacity:0}39%,52%{opacity:1}54%,100%{opacity:0}}
@keyframes vgood{0%,77%{opacity:0}79%{opacity:1}98%{opacity:1}100%{opacity:0}}
@keyframes fill1{0%,40%{fill:transparent}42%,100%{fill:#D97757}}
@keyframes fill2{0%,80%{fill:transparent}82%,100%{fill:#D97757}}
@keyframes exitglow{0%,80%{opacity:.35}84%,97%{opacity:1}100%{opacity:.35}}
@media (prefers-color-scheme:dark){
.g{fill:#444441;stroke:#B4B2A9}.p{fill:#3C3489;stroke:#AFA9EC}.te{fill:#085041;stroke:#5DCAA5}
.tg{fill:#F1EFE8}.tg2{fill:#D3D1C7}.tp{fill:#CECBF6}.tp2{fill:#AFA9EC}.tt{fill:#9FE1CB}.tt2{fill:#5DCAA5}.tc{fill:#F0997B}
.arc{stroke:#B4B2A9}.arcb{stroke:#F0997B}.parkp{stroke:#B4B2A9}
.tok{stroke:#2C2C2A}.pipc{stroke:#F0997B}
.exit{stroke:#5DCAA5}}
</style>
<defs><marker id="la" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="#888780" d="M0 0L10 5L0 10z"/></marker></defs>
<text class="th tg" x="30" y="30" font-size="16">The loop, from above</text>
<text class="ts tg2" x="30" y="48" font-size="11">review once; revise in a cycle until every contract holds. Bounded, never endless</text>

<path fill="none" stroke="#888780" stroke-width="2" marker-end="url(#la)" opacity="0.8" d="M212 146 C 300 122 400 132 468 152"/>
<path class="arc" d="M500 165 A135 135 0 0 1 635 300"/>
<path class="arc" d="M635 300 A135 135 0 0 1 500 435"/>
<path class="arc" d="M500 435 A135 135 0 0 1 365 300"/>
<path class="arc arcb" d="M365 300 A135 135 0 0 1 500 165"/>
<path class="exit" d="M290 300 L 218 300"/>
<path class="parkp" d="M330 350 C 280 405 250 420 218 428"/>

<rect class="p" x="30" y="118" width="182" height="62" rx="9"/>
<text class="th tp" x="121" y="143" text-anchor="middle">First review</text>
<text class="ts tp2" x="121" y="159" text-anchor="middle">thorough; every finding carries</text>
<text class="ts tp2" x="121" y="171" text-anchor="middle">a testable contract</text>

<rect class="g" x="420" y="140" width="160" height="50" rx="9"/>
<text class="th tg" x="500" y="161" text-anchor="middle">Open findings</text>
<text class="ts tg2" x="500" y="176" text-anchor="middle">the ledger holds the work</text>

<rect class="p" x="560" y="275" width="152" height="50" rx="9"/>
<text class="th tp" x="636" y="296" text-anchor="middle">Editor</text>
<text class="ts tp2" x="636" y="311" text-anchor="middle">a commit per finding</text>

<rect class="p" x="418" y="410" width="164" height="52" rx="9"/>
<text class="th tp" x="500" y="431" text-anchor="middle">Gate + Verifier</text>
<text class="ts tp2" x="500" y="447" text-anchor="middle">check passes; contracts run</text>

<rect class="g" x="296" y="272" width="138" height="56" rx="9"/>
<text class="th tg" x="365" y="296" text-anchor="middle">Anything open?</text>
<g class="vbad"><rect x="313" y="303" width="104" height="17" rx="8" fill="#FAECE7" stroke="#993C1D"/><text class="tl tc" x="365" y="315" text-anchor="middle">1 reopened</text></g>
<g class="vgood"><rect x="329" y="303" width="72" height="17" rx="8" fill="#E1F5EE" stroke="#0F6E56"/><text class="tl tt" x="365" y="315" text-anchor="middle">0 open</text></g>

<rect class="te" x="30" y="270" width="182" height="60" rx="9"/>
<text class="th tt" x="121" y="295" text-anchor="middle">Merged</text>
<text class="ts tt2" x="121" y="311" text-anchor="middle">rebase, proven MERGED</text>

<rect class="g" x="30" y="398" width="182" height="58" rx="9" stroke-dasharray="5 4"/>
<text class="th tg" x="121" y="420" text-anchor="middle">Parked</text>
<text class="ts tg2" x="121" y="434" text-anchor="middle">budget spent: full trail kept,</text>
<text class="ts tg2" x="121" y="446" text-anchor="middle">never an endless loop</text>

<circle class="pipc pip1" cx="467" cy="292" r="6"/>
<circle class="pipc pip2" cx="489" cy="292" r="6"/>
<circle class="pipc" cx="511" cy="292" r="6"/>
<circle class="pipc" cx="533" cy="292" r="6"/>
<text class="ts tg2" x="500" y="316" text-anchor="middle" font-weight="700" letter-spacing="0.5">ROUND BUDGET</text>

<text class="ts tc" x="398" y="196" text-anchor="middle">reopened: go around again</text>
<text class="ts tt2" x="253" y="288" text-anchor="middle">nothing open</text>
<text class="ts tg2" x="640" y="212" text-anchor="middle">revise</text>
<text class="ts tg2" x="700" y="470" text-anchor="end">the goal is one lap: contracts, banked fixes, and the filter exist to make the first pass the last</text>

<circle class="tok" r="8"/>
</svg>
