<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 552" width="860" role="img" aria-labelledby="lpt lpd" class="fg">
<title id="lpt">The review loop, from above</title>
<desc id="lpd">One thorough first review feeds open findings into a ring: editor, check gate, verifier, then the question of whether anything is open. A reopened finding goes around again past the round counter, whose budget of four rounds is kept on disk and parks the run when spent; a clean verdict exits to a proven merge. The animation shows a run converging on its second lap.</desc>
<style>
.fg{--bg:#FDFCFA;--card:#FFFFFF;--panel:#F1EFE8;--lane:#F6F4EE;--ink:#2C2C2A;--muted:#5F5E5A;--faint:#8b8a83;--line:#E4E2D8;--rule:#C9C7BE;--accent:#534AB7;--accent-bg:#EEEDFE;--accent-ink:#26215C;--accent-line:#B9B4EA;--teal:#0F6E56;--teal-bg:#E1F5EE;--teal-ink:#04342C;--teal-line:#8FCDB8;--coral:#993C1D;--coral-bg:#FAECE7;--coral-ink:#4A1B0C;--clay:#D97757;--term:#2C2C2A;--term-line:#2C2C2A;--shadow:.09}
@media (prefers-color-scheme:dark){.fg{--bg:#1E1E1C;--card:#2C2C2A;--panel:#383835;--lane:#232321;--ink:#F1EFE8;--muted:#B4B2A9;--faint:#8b8a83;--line:#44433F;--rule:#5F5E5A;--accent:#AFA9EC;--accent-bg:#2F2A6B;--accent-ink:#E4E2FB;--accent-line:#534AB7;--teal:#5DCAA5;--teal-bg:#0a3f33;--teal-ink:#C9F0E2;--teal-line:#0F6E56;--coral:#F0997B;--coral-bg:#4a2214;--coral-ink:#F5C4B3;--clay:#D97757;--term:#141413;--term-line:#44433F;--shadow:.3}}
.fg text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:11.5px;fill:var(--muted)}
.fg .mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
.fg .serif{font-family:'Iowan Old Style',Palatino,Georgia,serif}
.fg .h{font-size:13.5px;font-weight:700;fill:var(--ink)}
.fg .k{font-size:10.5px;font-weight:700;letter-spacing:1.6px;fill:var(--ink)}
.fg .mid{text-anchor:middle}.fg .end{text-anchor:end}
.fg .c{fill:var(--card);stroke:var(--line)}
.fg .cm{fill:var(--accent-bg);stroke:var(--accent-line)}
.fg .cg{fill:var(--teal-bg);stroke:var(--teal-line)}
.fg .hm{fill:var(--accent-ink)}.fg .sm{fill:var(--accent)}
.fg .hg2{fill:var(--teal-ink)}.fg .sg{fill:var(--teal)}
.fg .accent{fill:var(--accent)}.fg .teal{fill:var(--teal)}.fg .coral{fill:var(--coral)}
.fg .ar{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.fg .arh{fill:var(--faint)}
.fg .term{fill:var(--term);stroke:var(--term-line)}
.fg .tt{fill:#F1EFE8}.fg .tm{fill:#B4B2A9}.fg .tp{fill:#D97757;font-weight:700}.fg .tok{fill:#5DCAA5;font-weight:700}
.fg .ttl{font-size:16px;font-weight:700;fill:var(--ink)}
.fg .seg{fill:none;stroke:var(--rule);stroke-width:3.5}
.fg .segh{fill:var(--rule)}
.fg .re{fill:none;stroke:var(--coral);stroke-width:3;stroke-dasharray:2 7;stroke-linecap:round}
.fg .reh{fill:var(--coral)}
.fg .nd{fill:var(--card);stroke:var(--faint);stroke-width:2}
.fg .exit{fill:none;stroke:var(--teal);stroke-width:3;animation:lp-exit 24s linear infinite}
.fg .exh{fill:var(--teal);animation:lp-exit 24s linear infinite}
.fg .rn{font-size:54px;font-weight:700;fill:var(--ink);text-anchor:middle}
.fg .r1{opacity:0;animation:lp-r1 24s linear infinite}
.fg .r2{animation:lp-r2 24s linear infinite}
.fg .pip{fill:none;stroke:var(--clay);stroke-width:1.6}
.fg .pf{fill:var(--clay)}
.fg .p2{animation:lp-p2 24s linear infinite}
.fg .chip text{font-size:10.5px;font-weight:700;text-anchor:middle}
.fg .bad rect{fill:var(--coral-bg)}.fg .bad text{fill:var(--coral-ink)}
.fg .good rect{fill:var(--teal-bg)}.fg .good text{fill:var(--teal-ink)}
.fg .bad{opacity:0;animation:lp-bad 24s linear infinite}
.fg .good{animation:lp-good 24s linear infinite}
.fg .tok{fill:var(--clay);stroke:var(--card);stroke-width:2.5;offset-path:path('M196 304L280 304A120 120 0 0 1 520 304A120 120 0 0 1 280 304A120 120 0 0 1 520 304L690 304');offset-rotate:0deg;offset-distance:100%;animation:lp-travel 24s cubic-bezier(.4,0,.3,1) infinite}
.fg .done{fill:var(--teal);stroke:var(--teal)}
.fg .doneh{fill:var(--bg)}.fg .dones{fill:var(--bg);opacity:.85}
.fg .tick{fill:none;stroke:var(--bg);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
@keyframes lp-travel{0%,4%{offset-distance:0.0%}8%,10%{offset-distance:6.07%}14%,18%{offset-distance:12.87%}22%,25%{offset-distance:19.68%}29%,33%{offset-distance:26.48%}37%,44%{offset-distance:33.29%}50%,54%{offset-distance:46.9%}58%,59%{offset-distance:60.51%}63%,66%{offset-distance:67.31%}70%,72%{offset-distance:74.12%}76%,79%{offset-distance:80.92%}83%,88%{offset-distance:87.73%}93%,100%{offset-distance:100.0%}}
@keyframes lp-bad{0%,38%{opacity:0}40%,50%{opacity:1}52%,100%{opacity:0}}
@keyframes lp-good{0%,84%{opacity:0}86%,98%{opacity:1}100%{opacity:0}}
@keyframes lp-r1{0%,51%{opacity:1}53%,98%{opacity:0}100%{opacity:1}}
@keyframes lp-r2{0%,51%{opacity:0}53%,98%{opacity:1}100%{opacity:0}}
@keyframes lp-p2{0%,51%{fill:transparent}53%,98%{fill:var(--clay)}100%{fill:transparent}}
@keyframes lp-exit{0%,86%{opacity:.3}89%,98%{opacity:1}100%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.fg *{animation:none}}
</style>
<defs><filter id="lpsh" x="-10%" y="-25%" width="120%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1b1b19" flood-opacity="0.09"/></filter><marker id="lpa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arh" d="M1 1.5L9 5L1 8.5z"/></marker></defs>
<text class="ttl" x="30" y="32">The loop, from above</text>
<text x="30" y="52" style="font-size:12.5px">Review once; revise in a cycle until every contract holds. Bounded, never endless.</text>
