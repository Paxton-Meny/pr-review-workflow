<text x="46" y="74"><tspan class="k coral">REVIEWS</tspan><tspan class="d" dx="9">finds the defect and writes its contract</tspan></text>
<g filter="url(#hg-sh)"><rect class="card" x="46" y="86" width="406" height="220" rx="10"/></g>
<path class="panel" d="M46.5 96a9.5 9.5 0 0 1 9.5-9.5h386a9.5 9.5 0 0 1 9.5 9.5v16.5h-405z"/>
<path class="hl" d="M46 112.5H452"/>
<text class="mono fn" x="60" y="103.5">src/retry.py</text>
<rect class="band-coral" x="46.5" y="158" width="405" height="20"/>
<rect class="mark-coral" x="46.5" y="158" width="3" height="20"/>
<text class="mono ln" x="76" y="132">40</text><text class="mono code" x="98" y="132">for attempt in range(tries):</text>
<text class="mono ln" x="76" y="152">41</text><text class="mono code" x="125.6" y="152">try: return send(req)</text>
<text class="mono ln" x="76" y="172">42</text><text class="mono code" x="125.6" y="172">except NetError as e: err = e</text>
<text class="mono ln" x="76" y="192">43</text>
<g class="fix"><rect class="band-teal" x="46.5" y="178" width="405" height="20"/><text class="mono ln" x="76" y="192">43</text><text class="mono sgn" x="84" y="192">+</text><text class="mono code" x="98" y="192">raise err</text></g>
<path class="hl" d="M46 204.5H452"/>
<rect class="chip" x="60" y="216" width="42" height="18" rx="5"/><text class="mono fid" x="81" y="229">F003</text>
<text class="d" x="110" y="229">correctness · major</text>
<g class="st st-open"><rect x="368" y="216" width="72" height="18" rx="9"/><text x="404" y="229">open</text></g>
<g class="st st-addr"><rect x="368" y="216" width="72" height="18" rx="9"/><text x="404" y="229">addressed</text></g>
<g class="st st-ver"><rect x="368" y="216" width="72" height="18" rx="9"/><text x="404" y="229">verified</text></g>
<text class="t" x="60" y="255">Retry loop drops the final attempt’s error</text>
<text x="60" y="275"><tspan class="rk">Resolution:</tspan><tspan class="d"> the last attempt’s exception propagates</tspan></text>
<text class="d" x="60" y="292">to the caller, and the retry test asserts it.</text>

<circle class="n n2" cx="20" cy="338" r="7"/>
<text class="k2" x="46" y="342"><tspan class="k accent">FIXES</tspan><tspan class="d" dx="9">one commit per finding, nothing else touched</tspan></text>
<g class="a2"><g filter="url(#hg-sh)"><rect class="card" x="46" y="354" width="406" height="54" rx="10"/></g>
<text class="mono sha" x="60" y="377">c4f1a92</text>
<text class="t2" x="118" y="377">Raise the last attempt’s error (F003)</text>
<text class="d" x="60" y="395">pushed to retry-backoff · replied in the thread</text></g>

<circle class="n n3" cx="20" cy="440" r="7"/>
<text class="k3" x="46" y="444"><tspan class="k teal">PROVES</tspan><tspan class="d" dx="9">runs the check instead of judging prose</tspan></text>
<g class="a3"><g filter="url(#hg-sh)"><rect class="term" x="46" y="456" width="406" height="62" rx="10"/></g>
<text class="mono tc" x="60" y="480"><tspan class="tp">$</tspan> pytest tests/test_client.py::test_exhausted</text>
<rect class="cover" x="72" y="466" width="320" height="20"/>
<g class="res"><text class="mono tr" x="60" y="502"><tspan class="pass">1 passed</tspan> in 0.31s</text>
<path class="tick" d="M330 498l3.5 3.5 6.5-7.5"/><text class="holds" x="438" y="502">contract holds</text></g></g>

<circle class="n n4" cx="20" cy="550" r="8"/>
<path class="n4c" d="M16.2 550.2l2.7 2.7 5-5.6"/>
<text class="k4" x="46" y="554"><tspan class="k teal">MERGES</tspan><tspan class="d" dx="9">only after the gate asks you first</tspan></text>
