<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 572" width="460" role="img" aria-labelledby="hgt" class="hg">
<title id="hgt">One finding, start to finish, on pull request 128: the review flags line 42 of src/retry.py and writes a testable Resolution; one commit fixes it; the check command runs and passes, so the finding moves from open to addressed to verified; the pull request merges only after the gate asks.</title>
<style>
