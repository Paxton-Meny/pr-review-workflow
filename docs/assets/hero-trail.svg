<text class="h" x="46" y="21">Add retry with backoff</text>
<text class="d" x="46" y="38">#128 · retry-backoff into main</text>
<g class="pill pill-open"><rect x="390" y="12" width="62" height="24" rx="12"/><text x="421" y="28">Open</text></g>
<g class="pill pill-merged"><rect x="390" y="12" width="62" height="24" rx="12"/><text x="421" y="28">Merged</text></g>

