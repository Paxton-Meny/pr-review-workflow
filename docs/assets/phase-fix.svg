<text class="h" x="36" y="220" style="font-size:12.5px">The editing ladder</text>
<text x="36" y="236" style="font-size:10.5px">mechanical: minor or nit with a</text>
<text x="36" y="251" style="font-size:10.5px">proven fence → starts cheap</text>
<text x="36" y="266" style="font-size:10.5px">a blocker, security, or a flagged</text>
<text x="36" y="281" style="font-size:10.5px">file → never cheap</text>
<text x="36" y="296" style="font-size:10.5px">a retry: one lever up, effort</text>
<text x="36" y="311" style="font-size:10.5px">then model, under the posture</text>
</g>
<g class="cardg"><rect class="c" x="24" y="486" width="190" height="118" rx="9"/>
<text class="h" x="36" y="506" style="font-size:12.5px">Separation of powers</text>
<text x="36" y="522" style="font-size:10.5px">the editor cannot resolve a</text>
<text x="36" y="537" style="font-size:10.5px">thread; the verifier cannot</text>
<text x="36" y="552" style="font-size:10.5px">edit a file; the skim catches</text>
<text x="36" y="567" style="font-size:10.5px">changes no finding asked for</text>
<text x="36" y="582" style="font-size:10.5px">arbitration: one strong pass</text>
</g>
