<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 820" width="860" role="img" aria-labelledby="pft pfd" class="pf">
<title id="pft">Phase 4, Fix loop: a bounded ring with gates</title>
<desc id="pfd">Open findings go around a ring at most four times, the budget kept on disk: the round counter opens a round; routing gives each finding a starting rung, cheap for a minor finding with a proven fence, never cheap for a blocker, a security finding, or a flagged file, one lever up on a retry; the editor makes one commit per finding, replies, and pushes; the project's check gate must pass, with one repair allowed and a second failure parking the run; the verifier executes Check lines and judges each Resolution verbatim, resolving threads or reopening them with notes; a skim sends files no finding named to an incremental review; the count decides: open findings go around again, a finding reopened past the limit gets one arbitration, none open converges, and an unaccepted wont-fix never merges.</desc>
